[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castilla-idiomas-bot"
version = "0.1.0"
description = "Fluxo de atendimento do Castilla Idiomas Brasília"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "gunicorn>=22,<24; sys_platform != 'win32'",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.scripts]
castilla-bot = "castilla_bot.cli:main"

[tool.setuptools.packages.find]
include = ["castilla_bot*"]
